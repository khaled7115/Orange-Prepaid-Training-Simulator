e Telephony service enables making voice calls through the mobile operator\nNo-Telephony Lines its mean data lines only (For internet /USSD/SMS)\n\nCaller ID service script\nتتيح الخدمة معرفة رقم  المتصل بك و دى خدمة مجانية وطبعا فى حالة تسجيل المتصل على الهاتف يظهر الاسم\nIf received any inquiry concerning private number service use below script:\n \nتتم إضافة خدمة عدم إظهار رقم الطالب بناء علي طلب رسمي من الجهاز القومي لتنظيم الاتصالات, لمزيد من المعلومات برجاء الاتصال ب 155 من أي خط بسعر مكالمة التليفون الارضي من الأحد إلي الخميس من 8 صباحا حتى10 مساء و يومى الجمعة و السبت من 10 صباحا حتى 10 مساء\nCall Waiting script\nخدمة انتظار المكالمات أو ال waiting يا أ/…..\nمن خلالها تقدر تستقبل مكالمتين فى نفس الوقت  وهي متاحة لجميع عملاء اورنج\nممكن حضرتك تتحكم في تشغيلها و ايقافها عن طريق مجموعة أكواد أو من خلال  orange max itلعملاء الافراد ولوحضرتك إحتجت الاكواد تانى هنلاقيها علي  موقع اورنج WWW.Orange.eg\n\nCall Forwarding script\nالخدمة دى بتيح لحضرتك تحويل المكالمات حسب اختيارك إلى أي تليفون تانى حضرتك عايز تحول عليه مكالماتك سواء رقم أرضى او الشبكه التانيه\nمفيش اى اشتراك شهري التكلفة الوحيدة هى إن حضرتك بتتحاسب على تمن المكالمة المحولة من تليفون حضرتك للتليفون التانى\n \nوتقدر حضرتك تراجع المعلومات الخاصة بالخدمة و تعرف الأكواد بسهولة وفي أى وقت من خلال موقع orange max it\norange max it& Orange.eg\nCall barring script\nخدمة حظر المكالمات بتمكن حضرتك من منع إرسال أو استقبال المكالمات المحلى أو الدولي داخل مصر أو خارجها أثناء التجوال, و لكن للتوضيح الخدمة متاحة لخطوط الفواتير فقط\nلتشغيل أو وقف الخدمة لازم حضرتك تدخل الرقم السري 0000 و حضرتك تغيره بعد كده لأي أربع أرقام.  وفى بعض الأكواد هتحتاج إن حضرتك تكتبها معاية لتشغيل أو وقف الخدمة من على الموبايل و ممكن ابعت لحضرتك الاكواد في رسالة  بمجرد إضافة الخدمة على الموبايل يتم وقف إجراء المكالمات الدولية تلقائيا فبالتالي حضرتك لازم توقف الخدمة من على موبايل حضرتك أثناء التجوال\nحظر المكالمات  علشان حضرتك تضفها لازم تكون حضرتك مشترك في خدمة الدولي و بيكون ليها اشتراك شهري 10 جنية بالإضافة ل 10 جنية تامين تضاف على أول فاتورة بعد الاشتراك", "page": 40, "cat": "VAS & Services", "id": 44, "secs": [["Overview", "Telephony service Telephony service enables making voice calls through the mobile operator\nNo-Telephony Lines its mean data lines only (For internet /USSD/SMS)\nCaller ID service script\nتتيح الخدمة معرفة رقم  المتصل بك و دى خدمة مجانية وطبعا فى حالة تسجيل المتصل على الهاتف يظهر الاسم"], ["If received any inquiry concerning private number service", "تتم إضافة خدمة عدم إظهار رقم الطالب بناء علي طلب رسمي من الجهاز القومي لتنظيم الاتصالات, لمزيد من المعلومات برجاء الاتصال ب 155 من أي خط بسعر مكالمة التليفون الارضي من الأحد إلي الخميس من 8 صباحا حتى10 مساء و يومى الجمعة و السبت من 10 صباحا حتى 10 مساء\nCall Waiting script\nخدمة انتظار المكالمات أو ال waiting يا أ/…..\nمن خلالها تقدر تستقبل مكالمتين فى نفس الوقت  وهي متاحة لجميع عملاء اورنج\nممكن حضرتك تتحكم في تشغيلها و ايقافها عن طريق مجموعة أكواد أو من خلال  orange max itلعملاء الافراد ولوحضرتك إحتجت الاكواد تانى هنلاقيها علي  موقع اورنج WWW.Orange.eg\nCall Forwarding script\nالخدمة دى بتيح لحضرتك تحويل المكالمات حسب اختيارك إلى أي تليفون تانى حضرتك عايز تحول عليه مكالماتك سواء رقم أرضى او الشبكه التانيه\nمفيش اى اشتراك شهري التكلفة الوحيدة هى إن حضرتك بتتحاسب على تمن المكالمة المحولة من تليفون حضرتك للتليفون التانى\nوتقدر حضرتك تراجع المعلومات الخاصة بالخدمة و تعرف الأكواد بسهولة وفي أى وقت من خلال موقع orange max it\norange max it& Orange.eg\nCall barring script\nخدمة حظر المكالمات بتمكن حضرتك من منع إرسال أو استقبال المكالمات المحلى أو الدولي داخل مصر أو خارجها أثناء التجوال, و لكن للتوضيح الخدمة متاحة لخطوط الفواتير فقط\nلتشغيل أو وقف الخدمة لازم حضرتك تدخل الرقم السري 0000 و حضرتك تغيره بعد كده لأي أربع أرقام.  وفى بعض الأكواد هتحتاج إن حضرتك تكتبها معاية لتشغيل أو وقف الخدمة من على الموبايل و ممكن ابعت لحضرتك الاكواد في رسالة  بمجرد إضافة الخدمة على الموبايل يتم وقف إجراء المكالمات الدولية تلقائيا فبالتالي حضرتك لازم توقف الخدمة من على موبايل حضرتك أثناء التجوال\nحظر المكالمات  علشان حضرتك تضفها لازم تكون حضرتك مشترك في خدم و حضرتك عملت دقيقة من خدمة سلفني مكالمة ، سيتم خصم 40 قرش عند الشحن", "page": 50, "cat": "VAS & Services", "id": 82, "secs": [["Overview", "مع خدمة سلفني مكالمة، لو رصيد حضرتك أقل من 19 قرش هتقدر تعمل مكالمة لمدة 5 دقايق لأي رقم في مصر"], ["سعر الدقيقة 20 قرش داخل خدمة سلفني مكالمة", "سعر الدقيقة 20 قرش داخل خدمة سلفني مكالمة بحد ادنى 40 قرش"], ["مثال: لو حضرتك عملت دقيقة من", "مثال: لو حضرتك عملت دقيقة من خدمة سلفني مكالمة ، سيتم خصم 40 قرش عند الشحن"]], "terms": "Terms & Conditions: Not available in the provided training material."}, {"name": "Salefny Service Enhancement", "brief": "إذا حاول العميل طلب خدمة سلفني إنترنت، وكانت خدمة الإنترنت على الخط متوقفة، فإنه سيتم إخطار العميل بأنه يجب تفعيل خدمة الإنترنت أولاً، وفي حالة الضغط على إشتراك سيتم تفعيل الخدمة خلال ساعة.\nيمكن للعميل استخدام الخدمة حتى وان كان لديه باقة إنترنت (ولم تنتهي) وستكون الأولوية في الاستخدام لسلفني ميجابايت.\nيمكن للعميل الاستفادة من سلفني ميجابايت بغض النظر عن تاريخ تفعيل الخط. رسالة للعميل تبلغه باستهلاك 100% من الميجابايت.", "page": 50, "cat": "VAS & Services", "id": 83, "secs": [["Briefing", "إذا حاول العميل طلب خدمة سلفني إنترنت، وكانت خدمة الإنترنت على الخط متوقفة، فإنه سيتم إخطار العميل بأنه يجب تفعيل خدمة الإنترنت أولاً، وفي حالة الضغط على إشتراك سيتم تفعيل الخدمة خلال ساعة.\nيمكن للعميل استخدام الخدمة حتى وان كان لديه باقة إنترنت (ولم تنتهي) وستكون الأولوية في الاستخدام لسلفني ميجابايت.\nيمكن للعميل الاستفادة من سلفني ميجابايت بغض النظر عن تاريخ تفعيل الخط. رسالة للعميل تبلغه باستهلاك 100% من الميجابايت."]], "terms": "إذا حاول العميل طلب خدمة سلفني إنترنت، وكانت خدمة الإنترنت على الخط متوقفة، فإنه سيتم إخطار العميل بأنه يجب تفعيل خدمة الإنترنت أولاً، وفي حالة الضغط على إشتراك سيتم تفعيل الخدمة خلال ساعة."}, {"name": "Salefny Service Enhancement", "brief": "باقات سلفني ستتيح للعميل تجديد، وتحويل، وعمل تجديد مبكر لباقته الشهرية سواء كانت باقات مكالمات أو إنترنت حتى وإن كان ليس لديه رصيد كافي.\nمثال: إذا كان العميل على نظام فري ماكس 30، وكان لديه فقط 20 جنيه في حساب الرصيد، يمكنه استلاف بقيمة 10 جنيه لكي يقوم بتجديد باقته الشهرية.\nالمبلغ المستلف يجب أن يتم سداده في خلال 7 أيام، وإذا لم يتم دفع القيمة المستحقة ستدخل باقة سلفني المستخدمة في (وضع التجديد التلقائي) حتى يتم تسوية القيمة المطلوب دفعها.\nخلال وضع التجديد التلقائي سيستقبل العميل رسالة تنبيهية بشكل يومي بالقيمة المستحقة المطلوب سدادها، وأيضاً ستتم محاسبته بنفس نظام محاسبة وضع التجديد التلقائي للباقة الشهرية على الخط.\nلن يتأثر انتهاء صلاحية باقة المكالمات أو الإنترنت بحالة وضع التجديد التلقائي الخاص بالخدمة.\nيمكن للعميل الاستفادة من الخدمة من خلال:\nكود باقات الإنترنت من خلال #222# / كود تجديد الياقات من خلال #100# ثم اختيار رقم 5/ أو الكود #0#.\nإستلافها.\n\nالتفاصيل الكامله موجودة علي orange pedia \nلازم نقول الاسكريبتات كاااااااامله", "page": 50, "cat": "VAS & Services", "id": 84, "secs": [["Overview", "باقات سلفني ستتيح للعميل تجديد، وتحويل، وعمل تجديد مبكر لباقته الشهرية سواء كانت باقات مكالمات أو إنترنت حتى وإن كان ليس لديه رصيد كافي.\nمثال: إذا كان العميل على نظام فري ماكس 30، وكان لديه فقط 20 جنيه في حساب الرصيد، يمكنه استلاف بقيمة 10 جنيه لكي يقوم بتجديد باقته الشهرية.\nالمبلغ المستلف يجب أن يتم سداده في خلال 7 أيام، وإذا لم يتم دفع القيمة المستحقة ستدخل باقة سلفني المستخدمة في (وضع التجديد التلقائي) حتى يتم تسوية القيمة المطلوب دفعها.\nخلال وضع التجديد التلقائي سيستقبل العميل رسالة تنبيهية بشكل يومي بالقيمة المستحقة المطلوب سدادها، وأيضاً ستتم محاسبته بنفس نظام محاسبة وضع التجديد التلقائي للباقة الشهرية على الخط.\nلن يتأثر انتهاء صلاحية باقة المكالمات أو الإنترنت بحالة وضع التجديد التلقائي الخاص بالخدمة."], ["يمكن للعميل الاستفادة من الخدمة من خلال", "كود باقات الإنترنت من خلال #222# / كود تجديد الياقات من خلال #100# ثم اختيار رقم 5/ أو الكود #0#.\nإستلافها."], ["Agent instruction", "التفاصيل الكامله موجودة علي orange pedia\nلازم نقول الاسكريبتات كاااااااامله"]], "terms": "مثال: إذا كان العميل على نظام فري ماكس 30، وكان لديه فقط 20 جنيه في حساب الرصيد، يمكنه استلاف بقيمة 10 جنيه لكي يقوم بتجديد باقته الشهرية.\nالمبلغ المستلف يجب أن يتم سداده في خلال 7 أيام، وإذا لم يتم دفع القيمة المستحقة ستدخل باقة سلفني المستخدمة في (وضع التجديد التلقائي) حتى يتم تسوية القيمة المطلوب دفعها."}, {"name": "Rennelhom Service", "brief": "مع خدمة رِنّلهم حضرتك  تقدر تبعت رنة لاي رقم حتي لو مش معاك ثمن المكالمة- و دي بتكون مجرد رنة مش اتصال\nليك 5 محاولات في اليوم , اول مرتين مجانا و بعد كده 3 محاولات كل محاوله ب 05 قرش و هيتم سحب ال50 قرش لو الرصيد يسمح. \nبمجرد ان حضرتك بتتصل بالرقم اللي عايز توصلة و لو مش معاك ثمن المكالمة, هتسمع اختيارات , اختار الاختيار الثالث \"رِنّلهم\" والرقم هيجيله منك رنة\nبيتم سحب الرصيد لو في رصيد كافي او في حالة عدم وجود, بيتم الخصم مع أول شحنة.", "page": 51, "cat": "VAS & Services", "codes": [["1054", "G Info"]], "code": "1054", "codeNote": "G Info", "type": "Request For Info VAS", "area": "Request For InformationFeatures", "sub": "Informed", "sprod": "Rennelhom", "id": 85, "secs": [["Briefing", "مع خدمة رِنّلهم حضرتك  تقدر تبعت رنة لاي رقم حتي لو مش معاك ثمن المكالمة- و دي بتكون مجرد رنة مش اتصال\nليك 5 محاولات في اليوم , اول مرتين مجانا و بعد كده 3 محاولات كل محاوله ب 05 قرش و هيتم سحب ال50 قرش لو الرصيد يسمح.\nبمجرد ان حضرتك بتتصل بالرقم اللي عايز توصلة و لو مش معاك ثمن المكالمة, هتسمع اختيارات , اختار الاختيار الثالث \"رِنّلهم\" والرقم هيجيله منك رنة\nبيتم سحب الرصيد لو في رصيد كافي او في حالة عدم وجود, بيتم الخصم مع أول شحنة."]], "terms": "Terms & Conditions: Not available in the provided training material."}, {"name": "Credit transfer Revamp: خدمة تحويل الرصيد", "brief": "دي خدمه عن طريقها حضرتك تقدر تحول رصيد من و إلى أى خط الكارت أو أتكلم و أتحكم أو بريمو.\nو بتكون عن طريق 400 و #100#\nطبعا حضرتك لما بتستخدم الكود الخاص بتحويل الرصيد بتوصل لحضرتك رسالة تأكيد لإتمام عمليه التحويل فيها رقم الخط اللي حضرتك بتحوله الرصيد و أيضا المبلغ المحول , احب اوضح لحضرتك ان تحويل الرصيد مش هيتم إلا لو حضرتك أكدت عمليه التحويل عن طريق هذه الرسالة\nحضرتك تقدر تحول رصيد من خلال خدمه العملاء بحد اقصى 50 جنيه في المحاوله الواحده و 200 جنيه في الشهر\nو مستلم الرصيد يقدر يستقبل الرصيد بحد اقصى 50 جنيه في المحاوله الواحده و 200 جنيه في الشهر\n\nعملاء الكارت:\nقيمة التحويل من جنيه واحد إلى50 ، يتم خصم 2% من المبلغ المحول بحد أدني 30 قرش \nعملاء كنترول:\nالقيمة المحولة ستضاف إلي فاتورتك القادمة و القيمة المحولة يجب ألا تزيد عن 50 جنيه في العملية، يتم خصم 2% من المبلغ المحول بحد أدني 30 قرش.\n\nعن طريق قائمة ال- #100#\n- اتصل ب #100#\n- اضغط على2 لاختيار خدمات شكرا Shokran Services\n- اضغط 3 لاختيار حولي رصيد شكرا\n- اضغط 1 لتحويل الرصيد50 جنيه في العملية\n- ادخل مبلغ بدون كسور بحد ادنى 1 ج و بحد اقصى 50 جنيه في العملية\n- أدخل الرقم المرسل إليه", "page": 52, "cat": "VAS & Services", "codes": [["1052", "General Info. For the Credit transfer through 400 or USSD"]], "code": "1052", "codeNote": "General Info. For the Credit transfer through 400 or USSD", "type": "Request For Info VAS", "area": "Credit Transfer", "sub": "Informed", "sprod": "#100# / 400", "id": 86, "secs": [["Overview", "دي خدمه عن طريقها حضرتك تقدر تحول رصيد من و إلى أى خط الكارت أو أتكلم و أتحكم أو بريمو.\nو بتكون عن طريق 400 و #100#\nطبعا حضرتك لما بتستخدم الكود الخاص بتحويل الرصيد بتوصل لحضرتك رسالة تأكيد لإتمام عمليه التحويل فيها رقم الخط اللي حضرتك بتحوله الرصيد و أيضا المبلغ المحول , احب اوضح لحضرتك ان تحويل الرصيد مش هيتم إلا لو حضرتك أكدت عمليه التحويل عن طريق هذه الرسالة\nحضرتك تقدر تحول رصيد من خلال خدمه العملاء بحد اقصى 50 جنيه في المحاوله الواحده و 200 جنيه في الشهر\nو مستلم الرصيد يقدر يستقبل الرصيد بحد اقصى 50 جنيه في المحاوله الواحده و 200 جنيه في الشهر"], ["عملاء الكارت", "قيمة التحويل من جنيه واحد إلى50 ، يتم خصم 2% من المبلغ المحول بحد أدني 30 قرش"], ["عملاء كنترول", "القيمة المحولة ستضاف إلي فاتورتك القادمة و القيمة المحولة يجب ألا تزيد عن 50 جنيه في العملية، يتم خصم 2% من المبلغ المحول بحد أدني 30 قرش.\nعن طريق قائمة ال- #100#\n- اتصل ب #100#\n- اضغط على2 لاختيار خدمات شكرا Shokran Services\n- اضغط 3 لاختيار حولي رصيد شكرا\n- اضغط 1 لتحويل الرصيد50 جنيه في العملية\n- ادخل مبلغ بدون كسور بحد ادنى 1 ج و بحد اقصى 50 جنيه في العملية\n- أدخل الرقم المرسل إليه"]], "terms": "حضرتك تقدر تحول رصيد من خلال خدمه العملاء بحد اقصى 50 جنيه في المحاوله الواحده و 200 جنيه في الشهر\nو مستلم الرصيد يقدر يستقبل الرصيد بحد اقصى 50 جنيه في المحاوله الواحده و 200 جنيه في الشهر\nالقيمة المحولة ستضاف إلي فاتورتك القادمة و القيمة المحولة يجب ألا تزيد عن 50 جنيه في العملية، يتم خصم 2% من المبلغ المحول بحد أدني 30 قرش.\n- ادخل مبلغ بدون كسور بحد ادنى 1 ج و بحد اقصى 50 جنيه في العملية"}, {"name": "Line Modification – Voluntary Suspension", "brief": "Voluntary Suspension for Star Postpaid/ C&C lines script in case the suspended dial is standalone script:\n\nانا هوقف لحضرتك الخط ايقاف مؤقت مقابل  25 جنيه في الشهر غير شامل الضريبة بدلا من الاشتراك الشهري أو 0.83 قرش تقريبا  في اليوم غير شامل الضريبة.\nطبعا لو الخط أتوقف لفترة محاسبية كاملة بندفع رسوم الايقاف المؤقت فقط\nأنصح حضرتك بالانتظام في دفع رسوم الايقاف علشان متفقدش الخط في حاله عدم السداد .\nو مع تشغيل الخط الباقة مش بتنزل كاملة لكن بتحسب علي عدد ايام الشهر المتبقية.", "page": 53, "cat": "VAS & Services", "codes": [["1052", "In case customer asked about the service"]], "code": "1052", "codeNote": "In case customer asked about the service", "type": "Request For Info VAS", "area": "Features", "sub": "Informed", "sprod": "Voluntary Suspension", "id": 87, "secs": [["Voluntary Suspension for Star Postpaid/ C&C lines script", "انا هوقف لحضرتك الخط ايقاف مؤقت مقابل  25 جنيه في الشهر غير شامل الضريبة بدلا من الاشتراك الشهري أو 0.83 قرش تقريبا  في اليوم غير شامل الضريبة.\nطبعا لو الخط أتوقف لفترة محاسبية كاملة بندفع رسوم الايقاف المؤقت فقط\nأنصح حضرتك بالانتظام في دفع رسوم الايقاف علشان متفقدش الخط في حاله عدم السداد .\nو مع تشغيل الخط الباقة مش بتنزل كاملة لكن بتحسب علي عدد ايام الشهر المتبقية."]], "terms": "طبعا لو الخط أتوقف لفترة محاسبية كاملة بندفع رسوم الايقاف المؤقت فقط"}, {"name": "Line Modification – Voluntary Suspension", "brief": "Voluntary suspension & Reactivation for AL KART: \n\nطلب الإيقاف المؤقت هيتنفذ خلال ساعة. لكن عشان حضرتك تحافظ على الخط عشان نمنع الغائه نهائيا, لازم تعيد تشغيل الخط وتشحن أو ترسل أو تستقبل مكالمة أو رسالة من أي شبكه أو تستخدم ا باحا ل 5 مساءا ماعدى يوم الجمعه و الاجازات الرسمية."], ["Agent instruction", "التفاصيل الكامله موجودة علي orange pedia\nلازم نقول الاسكريبتات كاااااااامله"]], "terms": "Terms & Conditions: Not available in the provided training material."}, {"name": "Mobile number portability (MNP)", "brief": "Port out\nلو العميل بيتصل عشان عايز رقم حسابه يبقى هيكون محتاجه عشان يحول لشركه اخرى\nممكن أعرف من حضرتك سبب طلب التحويل من اورنج .\nالتحويل عن طريق فرع الشركه الى عايز تحول ليها.\nالخط ميكونش موقوف أو عليه غرامه و تقدر تحول الخط علي أي نظام بغض النظر عن النظام اللي الخط عليه حاليا سواء كان الكارت أو إشتراك شهري أو كنترول.\nوبالنسبة للفواتير المستحقة يجب سدادها و المبالغ الغير مفوترة بيكون لازم سدادها خلال 30 يوم من اصدار فاتورة التسوية النهائية ,لازم يكون مر 4 شهور على تشغيله او تحويله و التحويل بيتم في خلال يوم عمل واحد (غير شامل الجمعة والسبت)  , في حاله نجاح التحويل حضرتك مش هاتقدر تطلب التحويل مره ثانيه قبل مرور 4 شهور .", "page": 66, "cat": "VAS & Services", "codes": [["1652", "In case customer want to port out"]], "code": "1652", "codeNote": "In case customer want to port out", "type": "Request For Info MNP", "area": "Port Out Procedures", "sub": "-", "sprod": "Telephony", "id": 113, "secs": [["Port out", "لو العميل بيتصل عشان عايز رقم حسابه يبقى هيكون محتاجه عشان يحول لشركه اخرى\nممكن أعرف من حضرتك سبب طلب التحويل من اورنج .\nالتحويل عن طريق فرع الشركه الى عايز تحول ليها.\nالخط ميكونش موقوف أو عليه غرامه و تقدر تحول الخط علي أي نظام بغض النظر عن النظام اللي الخط عليه حاليا سواء كان الكارت أو إشتراك شهري أو كنترول.\nوبالنسبة للفواتير المستحقة يجب سدادها و المبالغ الغير مفوترة بيكون لازم سدادها خلال 30 يوم من اصدار فاتورة التسوية النهائية ,لازم يكون مر 4 شهور على تشغيله او تحويله و التحويل بيتم في خلال يوم عمل واحد (غير شامل الجمعة والسبت)  , في حاله نجاح التحويل حضرتك مش هاتقدر تطلب التحويل مره ثانيه قبل مرور 4 شهور ."]], "terms": "وبالنسبة للفواتير المستحقة يجب سدادها و المبالغ الغير مفوترة بيكون لازم سدادها خلال 30 يوم من اصدار فاتورة التسوية النهائية ,لازم يكون مر 4 ه بيتم خصمها"]], "terms": "Terms & Conditions: Not available in the provided training material."}, {"name": "Notarization Services", "brief": "بالتعاون مع وزارة العدل ووزارة الاتصالات وتكنولوجيا المعلومات تم الافتتاح التجريبي للتوثيق في بعض فروع اورنج \n تمهيداً لنشر خدمات التوثيق في  فروعنا  وفقاً للبروتوكول المبرم بين وزارة العدل وشركه اورنچ\nتحب اعرف حضرتك الفروع و عناوينها \nلحجز موعد برجاء تحميل تطبيق \"ارغب في عمل توكيل\" http://bit.ly/3AckI7F\nاو الدخول علي بوابة مصر الرقمية\nhttps://digital.gov.eg/\n\n\nBelow script to be communicated in case receiving customer asking about specific authorization:\n\nحضرتك تقدر تراجع انواع التوكيلات عن طريق منصة مصر الرقمية او من خلال تطبيق ارغب فى عمل توكيل وحجز عن طريقهم", "page": 87, "cat": "VAS & Services", "codes": [["1054", "In case customer asked about the service"]], "code": "1054", "codeNote": "In case customer asked about the service", "type": "Request For Info VAS", "area": "Features", "sub": "Informed", "sprod": "Real Estate Registration Department Services", "id": 138, "secs": [["Overview", "بالتعاون مع وزارة العدل ووزارة الاتصالات وتكنولوجيا المعلومات تم الافتتاح التجريبي للتوثيق في بعض فروع اورنج\nتمهيداً لنشر خدمات التوثيق في  فروعنا  وفقاً للبروتوكول المبرم بين وزارة العدل وشركه اورنچ\nتحب اعرف حضرتك الفروع و عناوينها\nلحجز موعد برجاء تحميل تطبيق \"ارغب في عمل توكيل\" http://bit.ly/3AckI7F\nاو الدخول علي بوابة مصر الرقمية\nhttps://digital.gov.eg/"], ["Below script to be communicated in case receiving", "حضرتك تقدر تراجع انواع التوكيلات عن طريق منصة مصر الرقمية او من خلال تطبيق ارغب فى عمل توكيل وحجز عن طريقهم"]], "terms": "Terms & Conditions: Not available in the provided training material."}, {"name": "E-Tadweer Program", "brief": "دلوقتي مع اورنج عند استرجاع اجهزتك الالكترونية القديمة سواء تليفونات  G 3G 4G2  5Gاو رواترز او تابلت او اجهزة لآب توب تقدر تاخذ لحد ٥٠٠ جنيه كاش باك علي محفظة اورنج , بالإضافة لنقاط عن طريق تحميل تطييق دايرة واحدة .\nكل اللي عليك تحميل تطبيق دايرة واحدة ( One Circle ) و اتباع الإ رض المساءلة القانونية وكمان في حالة إنك مضفتش الخدمة بيكون في إجراءات على الخط وممكن الخط يتوقف\nانا جاتلي رسالة إني اضيف الخدمة وانا بستخدم الخط استخدام شخصي ومش تسويقي\nالرسالة اللي جت لحضرتك بتكون بناءا على استخدام معين للخط ينطبق عليه الشروط المحددة من قبل جهازتنظيم الاتصالات ود بيكون موحد بين كل شركات الاتصالات في مصر\nانا جاتلي الرسالة ومش حابب اضيف الخدمة وهوقف استخدام الخط في التسويق\nفي الحالة دي بنسجل طلب حضرتك وبيتم المراجعة بس أحب اعرف حضرتك ان عدم إضافة الخدمة مع الاستمرار في التسويق ممكن يتسبب في إيقاف الخط وتعرض صاحب الخط للمساءلة القانونية\nانا ممكن ابلغ عن رقم خاص بشركة تانية\nحضرتك ممكن تبلغ عن أي رقم اورنج و لو الرقم تابع لشركه تانيه حضرتك بتبلغ فالشركه اللي تابع ليها الرقم\nانا مش عايز استقبل مكالمات من الرقم ده، أقدر اعمل ايه\nممكن حضرتك تضيف خدمة البلوك وتزود الرقم في blacklist", "page": 89, "cat": "VAS & Services", "codes": [["1054", "In case customer asked about the service"]], "code": "1054", "codeNote": "In case customer asked about the service", "type": "Request For Info VAS", "area": "Features", "sub": "Informed", "sprod": "CNAM Service", "id": 141, "secs": [["Briefing", "ايه هي خدمة ال CNAM\nة ودي خدمة بتخلي الرقم المضافة عليه لما يتصل بأي رقم يظهر اسم مع الرقم\nCNAM\nلعملاء الافراد: حضرتك بتشرفنا في فرع اورنج وبتمضي اقرار إضافة الخدمة\nلعملاء الشركات: مفوض الشركة بيطلب الإضافة عن طريق ممثل المبيعات أو من خلال زيارة أي فرع من فروع أورنج ويمضي اقرار إضافة الخدمة، بياكد علي الاسم وبيتم إضافة الخدمة علي خطوط الشركة\nوانا كمستقبل للمكالمة هستفيد ايه\nأولا هتوفر على حضرتك استقبال مكالمات غير مرغوب فيها\nكمان حضرتك تقدر تبلغ عن ارقام التسويق اللي بتزعجك و احنا بنراجع الأرقام وبنطلب من الأرقام التسويقية انهم يضيفوا الخدمة\nانا جالي رسالة إني لازم اضيف الخدمة، ايه اللي هيحصل لو مضفتهاش\nحضرتك بتحتاج تضيفها لتجنب التعرض المساءلة القانونية وكمان في حالة إنك مضفتش الخدمة بيكون في إجراءات على الخط وممكن الخط يتوقف\nانا جاتلي رسالة إني اضيف الخدمة وانا بستخدم الخط استخدام شخصي ومش تسويقي\nالرسالة اللي جت لحضرتك بتكون بناءا على استخدام معين للخط ينطبق عليه الشروط المحددة من قبل جهازتنظيم الاتصالات ود بيكون موحد بين كل شركات الاتصالات في مصر\nانا جاتلي الرسالة ومش حابب اضيف الخدمة وهوقف استخدام الخط في التسويق\nفي الحالة دي بنسجل طلب حضرتك وبيتم المراجعة بس أحب اعرف حضرتك ان عدم إضافة الخدمة مع الاستمرار في التسويق ممكن يتسبب في إيقاف الخط وتعرض صاحب الخط للمساءلة القانونية\nانا ممكن ابلغ عن رقم خاص بشركة تانية\nحضرتك ممكن تبلغ عن أي رقم اورنج و لو الرقم تابع لشركه تانيه حضرتك بتبلغ فالشركه اللي تابع ليها الرقم\nانا مش عايز استقبل مكالمات من الرقم ده، أقدر اعمل ايه\nممكن حضرتك تضيف خدمة البلوك وتزود الرقم في blacklist"]], "terms": "انا جالي رسالة إني لازم اضيف الخدمة، ايه اللي هيحصل لو مضفتهاش"}, {"name": "Private Recharge Service", "brief": "بإمكان حضرتك الشحن على الهوا من خلال الكود الشخصي\n\nالاشتراك بالخدمة بيكون من خلال الاتصال مجانا ب #5050#\n\n ها توصلك رسالة نصية تحتوي على الكود الشخصي اللي تقدر تقدمة لنقاط البيع لشحن رصيدك على الهوا\n\nIn case POS call 6006/110 asked about customer’s private recharge & or STK line transaction per day:\n\nخدمة الشحن بالكود الشخصي هي خدمة مقدمة لتحقيق الخصوصية لعملائنا\nو لذلك لا يجوز الاستفسار عن رقم محمول العميل بعد الشحن باستخدام هذا الكود", "page": 90, "cat": "VAS & Services", "codes": [["1054", "In case customer asked about the service"]], "code": "1054", "codeNote": "In case customer asked about the service", "type": "Request For Info VAS", "area": "Features", "sub": "Informed", "sprod": "Private Recharge", "id": 142, "secs": [["Overview", "بإمكان حضرتك الشحن على الهوا من خلال الكود الشخصي\nالاشتراك بالخدمة بيكون من خلال الاتصال مجانا ب #5050#\nها توصلك رسالة نصية تحتوي على الكود الشخصي اللي تقدر تقدمة لنقاط البيع لشحن رصيدك على الهوا"], ["In case POS call 6006/110 asked about customer’s", "خدمة الشحن بالكود الشخصي هي خدمة مقدمة لتحقيق الخصوصية لعملائنا\nو لذلك لا يجوز الاستفسار عن رقم محمول العميل بعد الشحن باستخدام هذا الكود"]], "terms": "Terms & Conditions: Not available in the provided training material."}, {"name": "Orange MAX IT", "brief": "ابلكيشن MAX IT هيساع  في حالة عدم وجود الـ67 قرش في خلال الشهر كله فسيتم الترحيل إلي الشهر التالي.\n\nويرجى العلم إن ضريبة الدمغة ليست ضريبة جديدة بل فقط تم زيادة قيمتها من قبل الدولة وتستحق عن جميع عملاء شركات المحمول. يتحملها المشترك وفقاً لنص القانون ويتم تحصيلها وتوريدها من خلال الشركة.", "page": 92, "cat": "VAS & Services", "codes": [["1006", "In case customer asked about the service"]], "code": "1006", "codeNote": "In case customer asked about the service", "type": "Billing And Usage", "area": "Due Amount", "sub": "Informed", "sprod": "Stamp taxes", "id": 144, "secs": [["Briefing", "طبقاً لقانون الضريبة على الدمغة وقانون فرض رسم تنمية الموارد المالية للدولة تستحق ثمانية جنيهات بدلاً من ستة جنيهات وعشرة قروش ضريبة سنوية يتحملها جميع عملاء شركات المحمول.\nبالنسبة لعملاء الاشتراك الشهري، تضاف قيمة الضريبة كاملةً (ثمانية جنيهات) على فاتورة المشترك مرة واحدة سنوياً.\nاما بالنسبة لعملاء الكارت المدفوع مقدما، فابتدأً من شهر يونيو 2020 سيتم خصم مبلغ الضريبة بواقع 67 قرش شهريا بدلاً من 51 قرش، وفي حالة عدم وجود رصيد كاف سيتم خصم المبلغ المتوافر في الرصيد مع ترحيل المتبقي لحين شحن الرصيد. اما في حالة عدم وجود الـ67 قرش في خلال الشهر كله فسيتم الترحيل إلي الشهر التالي.\nويرجى العلم إن ضريبة الدمغة ليست ضريبة جديدة بل فقط تم زيادة قيمتها من قبل الدولة وتستحق عن جميع عملاء شركات المحمول. يتحملها المشترك وفقاً لنص القانون ويتم تحصيلها وتوريدها من خلال الشركة."]], "terms": "ويرجى العلم إن ضريبة الدمغة ليست ضريبة جديدة بل فقط تم زيادة قيمتها من قبل الدولة وتستحق عن جميع عملاء شركات المحمول. يتحملها المشترك وفقاً لنص القانون ويتم تحصيلها وتوريدها من خلال الشركة."}, {"name": "New State Development Fees", "brief": "فعلا يا فندم في رسوم تنمية موارد الدولة فرضتها وزارة المالية بقانون صدر يوم 28 يونيو\nالخطوط الجديدة: الرسوم هتكون 50 جنيه + ضريبة القيمة المضافة، بإجمالى 61.5 جنيهً تضاف إلى سعر أي خط جديد\nالفواتير الشهرية: 10 جنيه + ضريبة القيمة المضافة، بإجمالى 12.31 جنيهً تضاف الى قيمة الفاتورة الشهرية (على الفاتورة كلها مش على كل خط)\nاحنا بنحصل الرسوم دي وبنوردها لوزارة المالية\nتطبق الرسوم من 29 ي yale  و العاب تانية بالاضافة لمجموعة العاب من Gameloft.\nفا تقدر تكمل لعبتك المفضلة في أي وقت وأي مكان. \nللإشتراك في باقة  GO Paly إسبوع كلم #32*14# وهيجيلك قسيمة مجانية على لعبة Asphlat 9.\nلمزيد من التفاصيل عن الباقات وباقي ألعاب الموبايل إلي بتشتغل مع GO Games إدخل على   https://www.orange.eg/ar/internet/go-day .\nس: إيه هي باقات GO Paly؟\nج:هي باقات انترنت جديدة مخصصة لأشهر ألعاب الموبايل اللى بتحتاج انترنت عشان تشتغل زي مثلاً :\nFIFA Soccer\nBattle of the empires\nClash Royale\nو العاب تانية بالاضافة لمجموعة العاب من Gameloft.\nفا تقدر تكمل لعب على game اللى بتحبه في أي وقت وأي مكان .\nو لو حضرتك عايز تعرف باقي elgames اللى بتشتغل مع GO Play ممكن حضرتك تدخل على orange.eg.\nاستهلاك العاب الموبايل في المجمل في حدود من 40 – 60 ميجا في اليوم لو بتلعب في حدود ساعة يوميا.\nفي بعض الالعاب ممكن تستهلك اكتر من كده مثلا PUBG  خصوصا لو بتلعبها فترات اطول.\nحدود الاستهلاك ديه لا تشمل تحميل الالعاب من الستور او أي تحديث/update من داخل اللعبة اللي في الاغلب بتستهلك انترنت اكتر من المعدلات اللازمة لمجرد انك تلعب ال game.", "page": 101, "cat": "Mobile Data", "id": 153, "secs": [["Overview", "\"Go Paly\" هي باقات انترنت جديدة مخصصة لأشهر ألعاب الموبايل إلي بتحتاج انترنت عشان تشتغل زي مثلاً FIFA Soccer – Battle of the empires– Clash Royale  و العاب تانية بالاضافة لمجموعة العاب من Gameloft.\nفا تقدر تكمل لعبتك المفضلة في أي وقت وأي مكان.\nللإشتراك في باقة  GO Paly إسبوع كلم #32*14# وهيجيلك قسيمة مجانية على لعبة Asphlat 9.\nلمزيد من التفاصيل عن الباقات وباقي ألعاب الموبايل إلي بتشتغل مع GO Games إدخل على   https://www.orange.eg/ar/internet/go-day ."], ["ج:هي باقات انترنت جديدة مخصصة لأشهر ألعاب الموبايل", "FIFA Soccer\nBattle of the empires\nClash Royale\nو العاب تانية بالاضافة لمجموعة العاب من Gameloft.\nفا تقدر تكمل لعب على game اللى بتحبه في أي وقت وأي مكان .\nو لو حضرتك عايز تعرف باقي elgames اللى بتشتغل مع GO Play ممكن حضرتك تدخل على orange.eg.\nاستهلاك العاب الموبايل في المجمل في حدود من 40 – 60 ميجا في اليوم لو بتلعب في حدود ساعة يوميا.\nفي بعض الالعاب ممكن تستهلك اكتر من  او من خلال ابلكيشن orange max itتفاصيل باقة GO سوشيال و خرائط؟باقات السوشيال و الخرائط بتبدأ من .252 ج لحد 5 ج من نص ساعة لحد ساعتين.تطبيقات و مواقع باقة السوشيال و الخرائط: تيك توك, انستاجرام, سنابشات, تويتر, فيسبوك, واتساب, بيقولك, كريم, جوجل مابس, اوبر, سويفل, دي دي."]], "terms": "ايه الباقات او الانظمة اللي متاح عليها الباقة؟باقات GO انترنت بالساعة متاحة لكل الانظمة الا انظمة الفاتورة (premier & eagle)و مش متاحة لخطوط الشركات."}, {"name": "Internet Gift Cards", "brief": "في حالة سؤال العميل عن سبب التغيير للميجابات :\nلم يتم تعديل أسعار باقات كارت الانترنت الهدية احنا رجعنا طريقة المحاسبة تبقي بالميجا علي كل المواقع علشان متابعة الانترنت تبقي اسهل وكمان حضرتك عندك عروض كتيير زى ضعف الباقة على GO تقدر تشترك فيها من عروض الانترنت من خلال #1# أو ابلكيشن orange max it\nيعنى إيه كروت الإنترنت الهدية؟\nباقات الإنترنت هدية تقدر تشتريها و تبعتها لحبايبك، و بتقدر تشتريها عن طريق الكود # 125#\n\nإزاى أقدر أحول كارت الإنترنت الهدية لحد؟\nعن طريق الـ USSD كود  #125# أو ابلكيشن orange max it أو IVR110\n\nالتفاصيل الكامله موجودة علي orange pedia \nلازم نقول الاسكريبتات كاااااااامله", "page": 104, "cat": "Mobile Data", "id": 156, "secs": [["في حالة سؤال العميل عن سبب التغيير للميجابات", "لم يتم تعديل أسعار باقات كارت الانترنت الهدية احنا رجعنا طريقة المحاسبة تبقي بالميجا علي كل المواقع علشان متابعة الانترنت تبقي اسهل وكمان حضرتك عندك عروض كتيير زى ضعف الباقة على GO تقدر تشترك فيها من عروض الانترنت من خلال #1# أو ابلكيشن orange max it"], ["يعنى إيه كروت الإنترنت الهدية", "باقات الإنترنت هدية تقدر تشتريها و تبعتها لحبايبك، و بتقدر تشتريها عن طريق الكود # 125#"], ["إزاى أقدر أحول كارت الإنترنت الهدية لحد", "عن طريق الـ USSD كود  #125# أو ابلكيشن orange max it أو IVR110"], ["Agent instruction", "التفاصيل الكامله موجودة علي orange pedia\nلازم نقول الاسكريبتات كاااااااامله"]], "terms": "Terms & Conditions: Not available in the provided training material."}, {"name": "Routing for Data buckets Deletion", "brief": "Script to be used till starting from 13/6/2021 Agents will not take da  if(ni<steps.length&&steps[0].t==='yn'&&steps[0].a===false)ni=steps.length;

 $('#ui').innerHTML=fb+`<button class="btn" onclick="${last?'finishQ()':'c2()'}">${last?(run.i+1>=run.qs.length?'Finish':'Next question'):'Next step'}</button>`;c.next=ni}
const NA_TR=NA;
function c2(){run.cur.si=run.cur.next;showStep()}
function finishQ(){const c=run.cur;run.log.push({tag:c.q.tag,ok:c.ok,dec:c.dec.length,good:c.dec.filter(Boolean).length,qid:c.q.id,sk:false});run.i++;nextQ()}
function skip(){const c=run.cur;run.log.push({tag:c.q.tag,ok:false,dec:c.q.steps.length,good:0,qid:c.q.id,sk:true});run.i++;nextQ()}
function summary(){
 if(!run||!run.log)return go('pedia');
 const L=run.log;const tot=L.reduce((a,x)=>a+x.dec,0),good=L.reduce((a,x)=>a+x.good,0);
 const sk=L.filter(x=>x.sk).length,wr=L.filter(x=>!x.ok&&!x.sk).length;
 const acc=tot?Math.round(good/tot*100):0;const by={};L.forEach(x=>{const b=by[x.tag]=by[x.tag]||{g:0,t:0};b.g+=x.good;b.t+=x.dec});
 const weak=Object.entries(by).filter(([k,b])=>b.g/b.t<.7).map(e=>e[0]),strong=Object.entries(by).filter(([k,b])=>b.g/b.t>=.8).map(e=>e[0]);
 st.sess.push({ts:Date.now(),acc,n:L.length,mode:run.mode});st.sess=st.sess.slice(-30);save();
 const wrongIds=L.filter(x=>!x.ok).map(x=>x.qid);const mode=run.mode;
 $('#main').innerHTML=`<h2>Session complete</h2><div class="card grid"><div class="stat"><b>${good}/${tot}</b>Score</div><div class="stat"><b style="color:var(--ok)">${L.length-wr-sk}</b>Questions correct</div><div class="stat"><b style="color:var(--no)">${wr}</b>Incorrect</div><div class="stat"><b>${sk}</b>Skipped</div><div class="stat"><b>${acc}%</b>Accuracy</div></div><div class="card"><b>Weak areas:</b> ${weak.length?weak.map(esc).join(', '):'none'}<br><b>Strong areas:</b> ${strong.length?strong.map(esc).join(', '):'none yet'}</div>${wrongIds.length?`<button class="btn" onclick="start('${mode}',[${wrongIds}],'retry')">RETRY WRONG ANSWERS (${wrongIds.length})</button>`:''}<button class="btn sec" onclick="go('${mode==='sim'?'sim':'quality'}')">New session</button>`;run=null}
/* ---------- DAILY / MISTAKES / PROGRESS / SETTINGS ---------- */
function rDaily(){
 const n=D.q.filter(inRange).length;
 $('#main').innerHTML=`<h2>DAILY TRAINING</h2><div class="card"><b>Current Study Range</b><div class="row" style="margin:10px 0">FROM PAGE: <input type="number" id="f" min="1" max="108" value="${st.from}"> TO PAGE: <input type="number" id="t" min="1" max="108" value="${st.to}"> <button class="btn" onclick="setR()">Apply</button></div>
 <div class="chips">${[[1,38,'Day 1: 1–38'],[39,50,'Day 2: 39–50'],[51,65,'Day 3: 51–65'],[66,108,'Pages 66–108']].map(r=>`<button class="btn sec" onclick="st.from=${r[0]};st.to=${r[1]};st.all=false;save();rDaily()">${r[2]}</button>`).join('')}</div><br>
 <label><input type="checkbox" style="width:auto" ${st.all?'checked':''} onchange="st.all=this.checked;save();rDaily()"> ALL MATERIAL (ignore the range)</label>
 <p>Active scope: <b>${st.all?'ALL MATERIAL':'Pages '+st.from+'–'+st.to}</b> — ${n} questions across Customer Simulator and Quality Training are available. The Pedia always contains the full material.</p>
 <button class="btn" onclick="go('sim')">Customer Simulator</button><button class="btn" onclick="go('quality')">Quality Training</button></div>`}
function setR(){let f=+$('#f').value||1,t=+$('#t').value||108;if(f>t)[f,t]=[t,f];st.from=f;st.to=t;st.all=false;save();rDaily()}
function rMist(){
 const by={};st.mist.forEach(x=>(by[x.tag]=by[x.tag]||[]).push(x));
 const tags=Object.keys(by);
 $('#main').innerHTML=`<h2>MY MISTAKES</h2>${tags.length?`<div class="card"><b>Practice only your weak areas</b><br>${tags.map(t=>`<button class="btn" onclick="start('quality',[${[...new Set(by[t].map(x=>x.qid))]}],'${t}')">Practice ${esc(t)} Mistakes (${by[t].length})</button>`).join('')}<br><button class="btn sec" onclick="start('quality',[${[...new Set(st.mist.map(x=>x.qid))]}],'all')">Practice all mistakes</button></div><div class="card"><table><tr><th>Area</th><th>Question</th></tr>${st.mist.slice().reverse().slice(0,40).map(x=>`<tr><td>${esc(x.tag)}</td><td dir="auto">${esc(x.txt)}</td></tr>`).join('')}</table></div>`:'<div class="card">No mistakes stored yet. Wrong answers will appear here.</div>'}`}
function rProg(){
 const T=Object.entries(st.tags);const c=T.reduce((a,x)=>a+x[1].c,0),w=T.reduce((a,x)=>a+x[1].w,0);
 $('#main').innerHTML=`<h2>PROGRESS</h2><div class="card grid"><div class="stat"><b>${st.sess.length}</b>Sessions</div><div class="stat"><b>${c}</b>Correct answers</div><div class="stat"><b>${w}</b>Incorrect</div><div class="stat"><b>${c+w?Math.round(c/(c+w)*100):0}%</b>Overall accuracy</div></div><div class="card"><h3>By area</h3>${T.length?T.map(([k,v])=>{const p=Math.round(v.c/(v.c+v.w)*100);return `<div class="row" style="margin:6px 0"><div style="width:130px">${esc(k)}</div><div class="bar" style="flex:1"><i style="width:${p}%"></i></div><div style="width:80px">${p}% (${v.c+v.w})</div></div>`}).join(''):'<span class="mu">No data yet.</span>'}</div><div class="card"><h3>Recent sessions</h3>${st.sess.slice().reverse().slice(0,10).map(s=>`<div>${new Date(s.ts).toLocaleString()} — ${s.mode} — ${s.n} questions — ${s.acc}%</div>`).join('')||'<span class="mu">None yet.</span>'}</div>`}
function rSet(){
 $('#main').innerHTML=`<h2>SETTINGS</h2><div class="card"><b>Training mode:</b> PREPAID CUSTOMER SERVICE<br><br><label><input type="checkbox" style="width:auto" ${st.src?'checked':''} onchange="st.src=this.checked;save()"> Show SOURCE page in explanations</label><br><br><b>Theme</b><div class="chips">${['auto','light','dark'].map(t=>`<button class="btn sec ${st.theme===t?'on':''}" onclick="st.theme='${t}';save();applyTheme();rSet()">${t}</button>`).join('')}</div><br><button class="btn sec" onclick="if(confirm('Delete all mistakes and progress?')){st.mist=[];st.tags={};st.sess=[];save();rSet()}">Reset progress &amp; mistakes</button></div><div class="card mu">Content comes only from the uploaded training deck. Items that the deck does not state are shown as "${NA}" or "Needs confirmation from training material". Image-only slides (e.g. slides 4, 15, 20 tables, 38, 107–108) could not be extracted as text; the transfer map on slide 4 was read from the image.</div>`}
render();
</script></body></html>
